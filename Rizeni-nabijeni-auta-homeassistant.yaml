alias: Řízení nabíjení auta
description: >-
  Řízení wallboxu podle zvoleného režimu. Záporná nákupní cena má absolutní
  prioritu a při připojeném autě vždy aktivuje nabíjení režimem Fast.

triggers:
  # Přepočítej požadovaný režim při jakékoliv relevantní změně.
  # "to: null" reaguje pouze na změnu skutečného state, ne na změny atributů.
  - trigger: state
    entity_id:
      - input_select.rezim_nabijeni_auta
      - sensor.solaxwallboxgaraz_run_mode
      - select.solaxwallboxgaraz_charger_use_mode
      - sensor.current_sell_electricity_price_15min
      - sensor.current_buy_electricity_price_15min
      - binary_sensor.buy_electricity_is_cheapest_1_hours_block_15min
      - binary_sensor.buy_electricity_is_cheapest_2_hours_block_15min
      - binary_sensor.buy_electricity_is_cheapest_3_hours_block_15min
      - binary_sensor.buy_electricity_is_cheapest_4_hours_block_15min
    to: null

  # Po restartu HA znovu zkontroluj správný stav wallboxu.
  - trigger: homeassistant
    event: start

conditions: []

actions:
  # Načtení aktuálních hodnot.
  - variables:
      selected_mode: "{{ states('input_select.rezim_nabijeni_auta') }}"
      run_mode: "{{ states('sensor.solaxwallboxgaraz_run_mode') }}"
      current_charger_mode: "{{ states('select.solaxwallboxgaraz_charger_use_mode') }}"
      buy_price_raw: "{{ states('sensor.current_buy_electricity_price_15min') }}"
      sell_price_raw: "{{ states('sensor.current_sell_electricity_price_15min') }}"

  # Pokud není připojené auto, nic nedělej.
  - condition: template
    value_template: >-
      {{ run_mode not in ['Available', 'unknown', 'unavailable'] }}

  # Pokud není možné přečíst / ovládat Charger Use Mode, nic neposílej.
  # Jakmile se entita znovu zpřístupní, její změna automatizaci znovu spustí.
  - condition: template
    value_template: >-
      {{ current_charger_mode not in ['unknown', 'unavailable'] }}

  # Určení požadovaného režimu wallboxu.
  - variables:
      desired_mode: >-
        {%- if is_number(buy_price_raw)
              and (buy_price_raw | float(0)) < 0 -%}

          Fast

        {%- elif selected_mode == 'Nabíjet auto při záporné prodejní ceně'
              and is_number(sell_price_raw)
              and (sell_price_raw | float(0)) < 0 -%}

          Green

        {%- elif selected_mode == 'Nabíjet auto z přetoků' -%}

          Green

        {%- elif selected_mode == 'Nabíjet auto při nejlevnější elektřině (1 hodina)'
              and is_number(buy_price_raw)
              and is_state('binary_sensor.buy_electricity_is_cheapest_1_hours_block_15min', 'on') -%}

          Fast

        {%- elif selected_mode == 'Nabíjet auto při nejlevnější elektřině (2 hodiny)'
              and is_number(buy_price_raw)
              and is_state('binary_sensor.buy_electricity_is_cheapest_2_hours_block_15min', 'on') -%}

          Fast

        {%- elif selected_mode == 'Nabíjet auto při nejlevnější elektřině (3 hodiny)'
              and is_number(buy_price_raw)
              and is_state('binary_sensor.buy_electricity_is_cheapest_3_hours_block_15min', 'on') -%}

          Fast

        {%- elif selected_mode == 'Nabíjet auto při nejlevnější elektřině (4 hodiny)'
              and is_number(buy_price_raw)
              and is_state('binary_sensor.buy_electricity_is_cheapest_4_hours_block_15min', 'on') -%}

          Fast

        {%- elif selected_mode == 'Nabíjet auto maximálním výkonem' -%}

          Fast

        {%- else -%}

          Stop

        {%- endif -%}

  # Neposílej zbytečně stejný režim, který už wallbox používá.
  - condition: template
    value_template: >-
      {{ desired_mode != current_charger_mode }}

  # Jediný zápis do wallboxu.
  - action: select.select_option
    target:
      entity_id: select.solaxwallboxgaraz_charger_use_mode
    data:
      option: "{{ desired_mode }}"

mode: restart
